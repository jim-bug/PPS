<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPS-v2</title>
    <h1 align="center">Particoular Power Strip v2</h1>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        .presa-container {
        display: flex;
        justify-content: space-around;
        align-items: center;
        width: 100%;
        min-height: 50vh;
        }

        .presa {
        width: 100px;
        height: 200px;
        border: none;
        background-color: transparent;
        cursor: pointer;
        padding: 0;
        }

        .presa svg {
        width: 100%;
        height: 100%;
        }
        .copyright-section {
            background-color: #000;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        footer {
            background-color: #333;
            color: #fff;
            padding: 20px;
            text-align: center;
            position: relative;
            bottom: 0;
            width: 100%;
            min-height: 11vh;
            }
        .footer-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .footer-content a {
            color: #1e90ff;
            text-decoration: none;
            margin: 0 5px;
        }
        .footer-content a:hover {
            text-decoration: underline;
        }
        .footer-content .github-icon {
            font-size: 2em;
            color: #fff;
        }
        .footer-content .license-info {
            margin-top: 10px;
            font-size: 0.9em;
        }
        .footer-content .license-info a {
            color: #1e90ff;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 50px; /* Spazio tra le celle */
            width: 80%; /* Larghezza della riga */
            max-width: 1200px;
            margin: 100px auto;
        }
        .cell {
            background-color: #000000;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2em;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            height: 50px; /* Altezza delle celle */
        }
    </style>
</head>
<body>
    <div class="presa-container">
        <button class="presa">
        </button>
        <button class="presa">
        </button>
        <button class="presa">
        </button>
        <button class="presa">
        </button>
    </div>
    <div class="container">
        <div class="cell"><p></p></div>
        <div class="cell"><p></p></div>
        <div class="cell"><p></p></div>
        <div class="cell"><p></p></div>
    </div>
    <footer>
        <div class="footer-content">
            <a href="https://github.com/jim_bug" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-github github-icon"></i>
            </a>
            <div class="license-info">
                <p>Distribuito sotto la <strong>Licenza GPL-v3</strong>. Per dettagli, consulta:<a href="https://www.gnu.org/licenses/gpl-3.0.html">LICENSE</a></p>
            </div>
        </div>
    </footer>
    </body>
    <script>
        const prese = document.querySelectorAll('.presa');
        prese.forEach((presa, index) => {
            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute('width', '100');
            svg.setAttribute('height', '200');
            svg.setAttribute('viewBox', '0 0 100 200');
            svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');

            // Add the SVG content from your provided code here
            svg.innerHTML = `
                <rect x="10" y="10" width="80" height="180" rx="10" ry="10" fill="#f0f0f0" stroke="#000" stroke-width="2"/>
                
                <path d="M40,50 a10,15 0 1,0 20,0 a10,15 0 1,0 -20,0" fill="#000"/>
                
                <circle cx="50" cy="100" r="10" fill="#000" />
                
                <path d="M40,150 a10,15 0 1,0 20,0 a10,15 0 1,0 -20,0" fill="#000"/>
            `;

            presa.appendChild(svg);

            presa.addEventListener('click', () => {
                window.location.href = `/socket/${index}`;
            });
        });
    </script>

</html>
